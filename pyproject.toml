[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-plugin-carbonvoice"
version = "0.3.6"
description = "Carbon Voice gateway adapter for Hermes Agent"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "python-socketio[asyncio_client]>=5",
]

[project.entry-points."hermes_agent.plugins"]
carbonvoice = "hermes_plugin_carbonvoice"

[tool.setuptools]
packages = ["hermes_plugin_carbonvoice"]

[tool.setuptools.package-dir]
hermes_plugin_carbonvoice = "."
