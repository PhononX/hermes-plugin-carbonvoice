name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'httpx>=0.27' 'python-socketio[asyncio_client]>=5.11' pyyaml

      - name: Syntax check all modules
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          fail = False
          for p in sorted(pathlib.Path('.').glob('*.py')):
              try:
                  ast.parse(p.read_text())
                  print(f"OK  {p.name}")
              except SyntaxError as e:
                  print(f"ERR {p.name}: {e}")
                  fail = True
          sys.exit(1 if fail else 0)
          PY

      - name: Validate plugin.yaml
        run: |
          python - <<'PY'
          import yaml, sys
          data = yaml.safe_load(open('plugin.yaml'))
          required = {'name', 'label', 'kind', 'version', 'requires_env'}
          missing = required - set(data.keys())
          assert not missing, f"plugin.yaml missing keys: {missing}"
          assert data['kind'] == 'platform', f"unexpected kind: {data['kind']!r}"
          assert any(e['name'] == 'CARBONVOICE_PAT' for e in data['requires_env']), \
              "CARBONVOICE_PAT must be in requires_env"
          print(f"plugin.yaml v{data['version']} OK")
          PY

      - name: Import hermes-agent-free modules
        run: |
          # adapter.py and setup.py import from `gateway.*` which only exists
          # inside an installed Hermes. The rest of the package is pure and
          # should import cleanly with just httpx + python-socketio.
          python - <<'PY'
          import importlib.util, pathlib, sys, types

          ROOT = pathlib.Path('.').resolve()
          pkg_name = 'carbonvoice'
          pkg = types.ModuleType(pkg_name)
          pkg.__path__ = [str(ROOT)]
          sys.modules[pkg_name] = pkg

          # Modules that don't touch gateway.*
          for name in ['constants', 'parse', 'dedupe', 'state', 'api', 'transport', 'users', 'audit', 'reactions', 'channels', 'gate', 'conversations']:
              spec = importlib.util.spec_from_file_location(
                  f'{pkg_name}.{name}', ROOT / f'{name}.py'
              )
              mod = importlib.util.module_from_spec(spec)
              sys.modules[f'{pkg_name}.{name}'] = mod
              spec.loader.exec_module(mod)
              print(f'imported {pkg_name}.{name}')

          # Sanity checks against the API surface
          from carbonvoice.parse import extract_transcript, extract_message_id
          assert extract_transcript({'text_models': [{'type': 'transcript', 'value': 'hi'}]}) == 'hi'
          assert extract_message_id({'message_id': 'abc'}) == 'abc'

          from carbonvoice.audit import AllowlistGate
          import os
          # Default-allow semantics: unset env vars → allow anyone.
          os.environ.pop('CARBONVOICE_ALLOW_ALL_USERS', None)
          os.environ.pop('CARBONVOICE_ALLOWED_USERS', None)
          assert AllowlistGate.from_env().is_allowed('anyone')
          # Explicit close.
          os.environ['CARBONVOICE_ALLOW_ALL_USERS'] = 'false'
          assert not AllowlistGate.from_env().is_allowed('anyone')
          os.environ.pop('CARBONVOICE_ALLOW_ALL_USERS')
          # Allowed list overrides the default.
          os.environ['CARBONVOICE_ALLOWED_USERS'] = 'abc'
          g = AllowlistGate.from_env()
          assert g.is_allowed('abc') and not g.is_allowed('xyz')
          os.environ.pop('CARBONVOICE_ALLOWED_USERS')

          from carbonvoice.dedupe import SeenCache
          c = SeenCache(ttl_s=60)
          assert not c.is_seen('x')
          c.mark('x')
          assert c.is_seen('x')

          from carbonvoice.parse import chat_type_from_channel
          # Safe defaults: missing/empty/unknown payload → "dm" (preserves
          # prior "bot responds always" behavior until we gate on chat_type).
          assert chat_type_from_channel(None) == 'dm'
          assert chat_type_from_channel({}) == 'dm'
          assert chat_type_from_channel({'unrelated': 'field'}) == 'dm'
          # Explicit signals from PersonalizedChannel.type
          assert chat_type_from_channel({'type': 'directMessage'}) == 'dm'
          assert chat_type_from_channel({'type': 'namedConversation'}) == 'group'
          assert chat_type_from_channel({'type': 'customerConversation'}) == 'group'
          assert chat_type_from_channel({'type': 'asyncMeeting'}) == 'group'
          # dm_hash fallback when ``type`` is absent
          assert chat_type_from_channel({'dm_hash': 'abc123'}) == 'dm'
          assert chat_type_from_channel({'dm_hash': None}) == 'dm'

          # Inline mention helpers: extract / detect / strip
          from carbonvoice.parse import (
              extract_inline_mentions, is_user_mentioned, strip_inline_mentions,
          )
          assert extract_inline_mentions(None) == []
          assert extract_inline_mentions('plain text') == []
          assert extract_inline_mentions('@[A](1)') == [('A', '1')]
          assert extract_inline_mentions('@[A](1) and @[B](2)') == [('A', '1'), ('B', '2')]
          # Display name may contain spaces and unicode
          assert extract_inline_mentions('@[Gi’ Martínez](GUID) hi') == [('Gi’ Martínez', 'GUID')]

          # Forward-compat: prefer tagged_user_ids when present
          assert is_user_mentioned({'tagged_user_ids': ['BOT']}, 'BOT') is True
          assert is_user_mentioned({'tagged_user_ids': ['OTHER']}, 'BOT') is False
          # Fallback to inline parsing
          assert is_user_mentioned({'transcript_txt': '@[Bot](BOT) hi'}, 'BOT') is True
          assert is_user_mentioned({'transcript_txt': 'no mention'}, 'BOT') is False
          # Empty tagged_user_ids falls through to inline path
          assert is_user_mentioned(
              {'tagged_user_ids': [], 'transcript_txt': '@[Bot](BOT) hi'}, 'BOT'
          ) is True
          # Missing user_id never matches
          assert is_user_mentioned({'tagged_user_ids': ['BOT']}, None) is False

          assert strip_inline_mentions(None) == ''
          assert strip_inline_mentions('plain') == 'plain'
          assert strip_inline_mentions('@[A](1) hi') == '@A hi'
          assert strip_inline_mentions('@[A](1) and @[B](2)') == '@A and @B'

          # MentionGate decisions
          from carbonvoice.gate import MentionGate
          g = MentionGate(require_mention=True, free_response_channels=set(), ignored_channels=set())
          # DM always passes regardless of mention
          assert g.evaluate(msg={'transcript_txt': 'hi'}, chat_type='dm', channel_id='c', self_user_id='BOT').process
          # Group without mention → skip
          assert not g.evaluate(msg={'transcript_txt': 'hi'}, chat_type='group', channel_id='c', self_user_id='BOT').process
          # Group with inline mention → process
          assert g.evaluate(msg={'transcript_txt': '@[Bot](BOT) hi'}, chat_type='group', channel_id='c', self_user_id='BOT').process
          # Group with tagged_user_ids forward-compat → process
          assert g.evaluate(msg={'tagged_user_ids': ['BOT']}, chat_type='group', channel_id='c', self_user_id='BOT').process

          # Ignored channel vetoes everything, including DMs
          g_mute = MentionGate(require_mention=True, free_response_channels=set(), ignored_channels={'mute'})
          assert not g_mute.evaluate(msg={'transcript_txt': '@[B](BOT) hi'}, chat_type='dm', channel_id='mute', self_user_id='BOT').process
          assert not g_mute.evaluate(msg={'transcript_txt': '@[B](BOT) hi'}, chat_type='group', channel_id='mute', self_user_id='BOT').process

          # Free-response channel bypasses mention requirement
          g_free = MentionGate(require_mention=True, free_response_channels={'free'}, ignored_channels=set())
          assert g_free.evaluate(msg={'transcript_txt': 'no mention'}, chat_type='group', channel_id='free', self_user_id='BOT').process

          # require_mention=false → group passes without mention
          g_open = MentionGate(require_mention=False, free_response_channels=set(), ignored_channels=set())
          assert g_open.evaluate(msg={'transcript_txt': 'no mention'}, chat_type='group', channel_id='c', self_user_id='BOT').process

          # from_env smoke
          import os
          for k in ['CARBONVOICE_REQUIRE_MENTION', 'CARBONVOICE_FREE_RESPONSE_CHANNELS', 'CARBONVOICE_IGNORED_CHANNELS']:
              os.environ.pop(k, None)
          gd = MentionGate.from_env()
          assert gd._require_mention is True
          assert gd._free_response_channels == set() and gd._ignored_channels == set()
          os.environ['CARBONVOICE_REQUIRE_MENTION'] = 'false'
          os.environ['CARBONVOICE_FREE_RESPONSE_CHANNELS'] = 'a, b ,c'
          os.environ['CARBONVOICE_IGNORED_CHANNELS'] = 'mute'
          ge = MentionGate.from_env()
          assert ge._require_mention is False
          assert ge._free_response_channels == {'a', 'b', 'c'}
          assert ge._ignored_channels == {'mute'}
          for k in ['CARBONVOICE_REQUIRE_MENTION', 'CARBONVOICE_FREE_RESPONSE_CHANNELS', 'CARBONVOICE_IGNORED_CHANNELS']:
              os.environ.pop(k, None)

          # ConversationTracker: LRU bounds + recency
          from carbonvoice.conversations import ConversationTracker, _LRUDict
          lru = _LRUDict(3)
          lru.set('a', 1); lru.set('b', 2); lru.set('c', 3)
          assert len(lru) == 3
          lru.set('d', 4)                  # evicts 'a' (oldest)
          assert lru.get('a') is None and lru.get('d') == 4 and len(lru) == 3
          lru.get('b')                     # bumps 'b' to most-recent
          lru.set('e', 5)                  # evicts 'c' (now oldest after 'b' bump)
          assert lru.get('c') is None and lru.get('b') == 2 and lru.get('e') == 5

          # thread_id_of: top-level → own id; reply → parent id;
          # fallback to _id / parent_message_guid; empty payload → None
          assert ConversationTracker.thread_id_of({'message_id': 'm1'}) == 'm1'
          assert ConversationTracker.thread_id_of({'message_id': 'm2', 'parent_message_id': 'r1'}) == 'r1'
          assert ConversationTracker.thread_id_of({'_id': 'm3'}) == 'm3'
          assert ConversationTracker.thread_id_of({'parent_message_guid': 'rg', 'message_id': 'm4'}) == 'rg'
          assert ConversationTracker.thread_id_of({}) is None

          # reply_anchors: thread-keyed, idempotent, ignores empty inputs
          t = ConversationTracker(api=None, max_reply_anchors=2, max_parent_text=2)
          t.set_reply_anchor('thread1', 'msg1')
          assert t.get_reply_anchor('thread1') == 'msg1'
          assert t.get_reply_anchor('missing') is None
          assert t.get_reply_anchor(None) is None
          t.set_reply_anchor('', 'msg2')             # empty id silently ignored
          t.set_reply_anchor('thread1', '')          # empty msg silently ignored, anchor stays
          assert t.get_reply_anchor('thread1') == 'msg1'
          t.clear_reply_anchor('thread1')
          assert t.get_reply_anchor('thread1') is None

          # parent_text cache: hits avoid re-fetch, None payloads cached too
          import asyncio
          class _FakeAPI:
              def __init__(self): self.calls = 0
              async def get_message(self, mid):
                  self.calls += 1
                  return {'transcript_txt': f'parent of {mid}'} if mid == 'with-text' else None
          async def _tracker_async():
              api = _FakeAPI()
              t = ConversationTracker(api=api)
              assert await t.get_parent_text('with-text') == 'parent of with-text'
              assert await t.get_parent_text('with-text') == 'parent of with-text'   # cache hit
              assert api.calls == 1
              assert await t.get_parent_text('absent') is None
              assert await t.get_parent_text('absent') is None                       # negative cache
              assert api.calls == 2
              assert await t.get_parent_text(None) is None and await t.get_parent_text('') is None
              assert api.calls == 2
          asyncio.run(_tracker_async())

          # Note: setup._env_enablement (which seeds group_sessions_per_user
          # from CARBONVOICE_SHARED_GROUP_SESSIONS) imports from gateway.*
          # and so can't run in this gateway-free CI step. The logic is a
          # one-liner ``if _bool_env('CARBONVOICE_SHARED_GROUP_SESSIONS'):
          # seed['group_sessions_per_user'] = False`` — covered by the
          # ``Syntax check all modules`` step and validated end-to-end in
          # local dogfooding before each PR.

          print('smoke tests OK')
          PY
